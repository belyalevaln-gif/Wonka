<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#321330"><title>Золотой билет · Фабрика Вонки</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff0cf;background:radial-gradient(ellipse at 50% 46%,#783955,#391935 58%,#200e25);min-height:100svh;font:16px Georgia,serif;text-align:center}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:auto;width:min(1040px,90%);color:#e7cfaa}header{padding:19px 0;border-bottom:1px solid #d2af7545}header b{font:italic bold 24px Georgia}small{font:14px Georgia}main{padding:clamp(24px,5vh,55px) 12px 26px}h1{font-size:clamp(44px,7vw,84px);font-weight:normal;line-height:.96;letter-spacing:-.055em;margin:12px 0;color:#ffdf95}p{margin:12px 0 0;color:#f2dbcb}.stage{display:grid;place-items:center;position:relative;width:min(100%,650px);height:clamp(270px,42vh,410px);margin:auto;isolation:isolate}.halo{position:absolute;z-index:-1;width:min(79%,355px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from -9deg,#dc9d7a13 0 9deg,transparent 9deg 24deg);border:1px solid #e4b38939;box-shadow:0 0 0 6px #512442,0 0 0 7px #e4b38925}.stars{position:absolute;inset:0;pointer-events:none;color:#f5cf83}.stars i{position:absolute;font-style:normal}.bar,.ticket{position:absolute;width:min(70%,316px);aspect-ratio:2.03;border:0;cursor:pointer}.bar{transform:rotate(-10deg);background:repeating-linear-gradient(99deg,#a8a1a7,#fff 4px,#817b81 8px,#c3bfc6 11px);box-shadow:4px 15px 18px #1e071b88;transition:transform .9s,opacity .9s;perspective:650px}.paper{position:absolute;inset:0 4%;background:#741e24 url(wrapper.jpg) center/100% 100%;box-shadow:0 0 3px #30110a}.foil{position:absolute;inset:0 0 0 96%;background:repeating-linear-gradient(113deg,#82777b,#fff 6px,#938691 13px);transform-origin:left;transition:transform .8s,width .8s,left .8s}.opened .foil{left:88%;width:25%;transform:rotateY(-135deg)}.opened .bar{transform:translateY(44%) rotate(-8deg) scale(.84);opacity:.64;pointer-events:none}.ticket{visibility:hidden;opacity:0;overflow:hidden;background:linear-gradient(118deg,#ab6923,#ffe094 29%,#d99f3d 53%,#ffe7a4 73%,#b77b2b);color:#522b15;outline:2px solid #825520;outline-offset:-8px;box-shadow:3px 12px 18px #210b1d88;transform:rotate(-10deg) scale(.85);transition:transform 1.1s .18s,opacity .7s .15s;padding:17px;font:italic 16px Georgia}.ticket strong{display:block;margin:5px;font: bold clamp(25px,5vw,37px)/1 Georgia}.opened .ticket{visibility:visible;opacity:1;transform:translateY(-24%) rotate(5deg)}.ticket:after{content:'';position:absolute;inset:-70%;pointer-events:none;background:linear-gradient(110deg,transparent 43%,#fff9 50%,transparent 57%);animation:shine 3.3s infinite}@keyframes shine{from{transform:translateX(-66%)}to{transform:translateX(66%)}}.cta{padding:14px 30px;border:1px solid #fff1c6;border-radius:28px;background:linear-gradient(#ffe5a4,#dfac5b);color:#44213a;cursor:pointer;font:bold 17px Georgia;box-shadow:0 4px 0 #81522f}button:focus-visible{outline:3px solid white;outline-offset:4px}footer{justify-content:center;border-top:1px solid #d2af7545;padding:18px;font-style:italic}body.won .ticket{transform:rotate(-3deg) scale(1.09)}body.won .ticket strong{font-size:clamp(21px,4vw,31px)}@media(prefers-reduced-motion:reduce){*,*:after{transition:none!important;animation:none!important}}
</style>
<header><b>Wonka</b><small>Шоколадная фабрика</small></header>
<main><span aria-hidden="true">✧　❄　✧</span><h1>Золотой билет</h1><p id="hint" aria-live="polite">В этой шоколадке спрятано зимнее приключение.</p>
<div class="stage"><div class="halo"></div><div class="stars" aria-hidden="true"></div><button class="bar" aria-label="Развернуть шоколадку"><span class="paper"></span><span class="foil"></span></button><button class="ticket" disabled><span>Фабрика Вонки</span><strong>Золотой билет</strong><span class="caption">✦　Нажми на меня　✦</span></button></div>
<button class="cta">Развернуть шоколадку</button></main><footer>Новогодняя коллекция</footer>
<script>
// Семейный список развлечений. Каждая строка — отдельный билет.
const activities = [
  'Испечь имбирных человечков', 'Устроить домашний кинотеатр',
  'Пойти искать самую красивую ёлку', 'Построить снежную крепость',
  'Сварить горячий шоколад', 'Сделать игрушки для ёлки',
  'Устроить вечер настольных игр', 'Слепить семью снеговиков'
];
const bar = document.querySelector('.bar');
const ticket = document.querySelector('.ticket');
const action = document.querySelector('.cta');
const hint = document.querySelector('#hint');
const title = ticket.querySelector('strong');
const caption = ticket.querySelector('.caption');
let phase = 'wrapped';
let remaining = [];
function advance() {
  if (phase === 'wrapped') {
    phase = 'ticket';
    document.body.className = 'opened';
    bar.disabled = true;
    ticket.disabled = false;
    hint.textContent = 'Золотой билет твой! Коснись его, чтобы узнать сюрприз.';
    action.textContent = 'Открыть билет';
    ticket.focus({preventScroll:true});
  } else if (phase === 'ticket') {
    if (!remaining.length) remaining = [...activities];
    const index = Math.floor(Math.random() * remaining.length);
    const prize = remaining.splice(index, 1)[0];
    phase = 'prize';
    document.body.className = 'opened won';
    title.textContent = prize;
    caption.textContent = '✦　✦　✦';
    ticket.disabled = true;
    hint.textContent = 'Твоё новогоднее приключение — ' + prize.toLowerCase() + '!';
    action.textContent = 'Ещё шоколадку';
    action.focus({preventScroll:true});
  } else {
    phase = 'wrapped';
    document.body.className = '';
    bar.disabled = false;
    title.textContent = 'Золотой билет';
    caption.textContent = '✦　Нажми на меня　✦';
    hint.textContent = 'Какое приключение попадётся теперь?';
    action.textContent = 'Развернуть шоколадку';
    bar.focus({preventScroll:true});
  }
}
bar.onclick = ticket.onclick = action.onclick = advance;
const sky = document.querySelector('.stars');
for (const [x,y,size] of [[8,27,21],[18,72,16],[78,14,25],[87,69,18],[24,10,11],[69,82,12]]) {
  const star = document.createElement('i');
  star.textContent = '✦';
  Object.assign(star.style,{left:x+'%',top:y+'%',fontSize:size+'px'});
  sky.append(star);
}
</script></html>
