<header><b>Wonka</b><small>Шоколадная фабрика</small></header>
<main><span aria-hidden="true">✧　❄　✧</span><h1>Золотой билет</h1><p id="hint" aria-live="polite">В этой шоколадке спрятано зимнее приключение.</p>
<div class="stage"><div class="halo"></div><div class="stars" aria-hidden="true"></div><button class="bar" aria-label="Развернуть шоколадку"><span class="paper"></span><span class="foil"></span></button><button class="ticket" disabled><span>Фабрика Вонки</span><strong>Золотой билет</strong><span class="caption">✦　Нажми на меня　✦</span></button></div>
<button class="cta">Развернуть шоколадку</button></main><footer>Новогодняя коллекция</footer>
<script>
// Семейный список развлечений. Каждая строка — отдельный билет.
const activities = [
  'Испечь имбирных человечков', 'Устроить домашний кинотеатр',
  'Пойти искать самую красивую ёлку', 'Построить снежную крепость',
  'Сварить горячий шоколад', 'Сделать игрушки для ёлки',
  'Устроить вечер настольных игр', 'Слепить семью снеговиков'
];
const bar = document.querySelector('.bar');
const ticket = document.querySelector('.ticket');
const action = document.querySelector('.cta');
const hint = document.querySelector('#hint');
const title = ticket.querySelector('strong');
const caption = ticket.querySelector('.caption');
let phase = 'wrapped';
let remaining = [];
function advance() {
  if (phase === 'wrapped') {
    phase = 'ticket';
    document.body.className = 'opened';
    bar.disabled = true;
    ticket.disabled = false;
    hint.textContent = 'Золотой билет твой! Коснись его, чтобы узнать сюрприз.';
    action.textContent = 'Открыть билет';
    ticket.focus({preventScroll:true});
  } else if (phase === 'ticket') {
    if (!remaining.length) remaining = [...activities];
    const index = Math.floor(Math.random() * remaining.length);
    const prize = remaining.splice(index, 1)[0];
    phase = 'prize';
    document.body.className = 'opened won';
    title.textContent = prize;
    caption.textContent = '✦　✦　✦';
    ticket.disabled = true;
    hint.textContent = 'Твоё новогоднее приключение — ' + prize.toLowerCase() + '!';
    action.textContent = 'Ещё шоколадку';
    action.focus({preventScroll:true});
  } else {
    phase = 'wrapped';
    document.body.className = '';
    bar.disabled = false;
    title.textContent = 'Золотой билет';
    caption.textContent = '✦　Нажми на меня　✦';
    hint.textContent = 'Какое приключение попадётся теперь?';
    action.textContent = 'Развернуть шоколадку';
    bar.focus({preventScroll:true});
  }
}
bar.onclick = ticket.onclick = action.onclick = advance;
const sky = document.querySelector('.stars');
for (const [x,y,size] of [[8,27,21],[18,72,16],[78,14,25],[87,69,18],[24,10,11],[69,82,12]]) {
  const star = document.createElement('i');
  star.textContent = '✦';
  Object.assign(star.style,{left:x+'%',top:y+'%',fontSize:size+'px'});
  sky.append(star);
}
</script></html>
